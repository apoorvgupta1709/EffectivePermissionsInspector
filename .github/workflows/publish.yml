name: Publish to NuGet

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Build, Pack & Publish
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build & Pack Release
        run: |
          dotnet pack --configuration Release --output ./artifacts

      - name: Patch Package ContentType for XrmToolBox Portal
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          Get-ChildItem -Path ./artifacts -Filter *.nupkg | ForEach-Object {
            $archive = [System.IO.Compression.ZipFile]::Open($_.FullName, [System.IO.Compression.ZipArchiveMode]::Update)
            $entry = $archive.GetEntry("[Content_Types].xml")
            if ($entry) {
              $reader = New-Object System.IO.StreamReader($entry.Open())
              $content = $reader.ReadToEnd()
              $reader.Close()
              if ($content -match 'Extension="png" ContentType="application/octet"') {
                $content = $content.Replace('Extension="png" ContentType="application/octet"', 'Extension="png" ContentType="image/png"')
                $entry.Delete()
                $newEntry = $archive.CreateEntry("[Content_Types].xml")
                $writer = New-Object System.IO.StreamWriter($newEntry.Open())
                $writer.Write($content)
                $writer.Close()
              }
            }
            $archive.Dispose()
          }

      - name: NuGet Login (OIDC Trusted Publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: Apoorv

      - name: Push to NuGet.org
        run: |
          dotnet nuget push ./artifacts/*.nupkg 
            --api-key "$((steps.login.outputs.NUGET_API_KEY) ? steps.login.outputs.NUGET_API_KEY : secrets.NUGET_API_KEY)" 
            --source https://api.nuget.org/v3/index.json 
            --skip-duplicate
